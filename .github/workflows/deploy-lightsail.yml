name: Deploy to Lightsail

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: lightsail-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install mdbtools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mdbtools

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Production build
        run: npm run build

  deploy:
    name: SSH deploy
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check required secrets
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USERNAME: ${{ secrets.LIGHTSAIL_USER }}
          KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          missing=0
          if [ -z "$HOST" ]; then echo "Missing secret: LIGHTSAIL_HOST"; missing=1; fi
          if [ -z "$USERNAME" ]; then echo "Missing secret: LIGHTSAIL_USER"; missing=1; fi
          if [ -z "$KEY" ]; then echo "Missing secret: LIGHTSAIL_SSH_KEY"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the Lightsail secrets in GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            if [ ! -d "$HOME/jodo/.git" ]; then
              echo "App directory missing. Clone once on the server first:"
              echo "  git clone https://github.com/Comexcyc/ReactTestProject.git ~/jodo"
              exit 1
            fi
            bash "$HOME/jodo/scripts/deploy.sh"
